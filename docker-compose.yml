services:
  postgres:
    image: postgres:14
    container_name: backend-postgres
    environment:
      POSTGRES_DB: job_matching
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: backend-redis
    ports:
      - "6380:6379"

volumes:
  postgres_data:
